<!doctype html>
<html lang="en" data-language="en" class="scroll-smooth">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | strip_html | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
    <script>
      try {
        const preference = localStorage.getItem('theme') || 'system';
        const dark = preference === 'dark' || (preference === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.dataset.language = localStorage.getItem('language') || 'en';
        document.documentElement.lang = document.documentElement.dataset.language;
      } catch (_) {}
    </script>
    <link rel="stylesheet" href="{{ '/assets/css/tailwind.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  </head>
  <body class="min-h-screen bg-white text-slate-900 antialiased transition-colors duration-300 dark:bg-black dark:text-slate-100">
    <a class="skip-link" href="#main-content"><span data-lang="en">Skip to main content</span><span data-lang="zh">跳至主要内容</span></a>
    {% include navbar.html %}
    <main id="main-content" class="min-h-screen">{{ content }}</main>
    {% include footer.html %}
    {% include search-modal.html %}
    <script>window.ICS_BASE_URL = {{ site.baseurl | jsonify }};</script>
    <script src="{{ '/assets/js/app.js' | relative_url }}" defer></script>
  </body>
</html>
