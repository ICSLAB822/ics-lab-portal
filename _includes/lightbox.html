<dialog data-lightbox aria-label="Image preview" data-aria-en="Image preview" data-aria-zh="图片预览" class="fixed inset-0 m-0 h-full max-h-none w-full max-w-none border-0 p-0 bg-white/95 dark:bg-black/95 text-slate-900 dark:text-white backdrop:backdrop-blur-md">
<button class="absolute top-6 right-6 p-2 text-slate-500 hover:text-red-500 dark:text-slate-400 dark:hover:text-red-400 transition-colors z-50" data-dialog-close aria-label="Close lightbox" data-aria-en="Close image preview" data-aria-zh="关闭图片预览">{% include icon.html name="X" pixels=32 %}</button>
{% if include.gallery %}<button data-lightbox-prev aria-label="Previous photo" data-aria-en="Previous photo" data-aria-zh="上一张照片" class="absolute left-4 md:left-8 top-1/2 p-3 rounded-full bg-slate-100/50 dark:bg-slate-800/50 hover:bg-blue-500 hover:text-white dark:hover:bg-blue-600 transition-all z-40 hidden md:block">{% include icon.html name="ChevronLeft" pixels=32 %}</button><button data-lightbox-next aria-label="Next photo" data-aria-en="Next photo" data-aria-zh="下一张照片" class="absolute right-4 md:right-8 top-1/2 p-3 rounded-full bg-slate-100/50 dark:bg-slate-800/50 hover:bg-blue-500 hover:text-white dark:hover:bg-blue-600 transition-all z-40 hidden md:block">{% include icon.html name="ChevronRight" pixels=32 %}</button>{% endif %}
<div data-lightbox-backdrop class="w-full h-full flex flex-col items-center justify-center px-4 md:px-20 py-12"><div class="relative max-w-7xl max-h-[90vh] flex flex-col items-center justify-center w-full"><div data-lightbox-content class="flex justify-center max-w-full"></div><div class="mt-4 text-center max-w-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-3 px-6 shadow-lg rounded-sm"><div data-lightbox-counter class="font-mono text-xs text-blue-600 dark:text-blue-400 mb-1 font-bold tracking-wider"></div><p data-lightbox-caption class="text-sm text-slate-900 dark:text-white font-medium"></p></div></div></div>
{% if include.gallery %}<button data-lightbox-prev aria-label="Previous photo" data-aria-en="Previous photo" data-aria-zh="上一张照片" class="md:hidden absolute inset-y-0 left-0 w-1/4 z-30"></button><button data-lightbox-next aria-label="Next photo" data-aria-en="Next photo" data-aria-zh="下一张照片" class="md:hidden absolute inset-y-0 right-0 w-1/4 z-30"></button>{% endif %}
</dialog>
