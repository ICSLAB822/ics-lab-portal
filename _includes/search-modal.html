<dialog data-search-dialog aria-label="Search site" data-aria-en="Search site" data-aria-zh="站内搜索" class="mt-24 mx-auto mb-0 w-[min(calc(100%_-_2rem),42rem)] max-h-[80vh] bg-white dark:bg-black border border-slate-200 dark:border-slate-800 shadow-2xl rounded-lg p-0 text-slate-900 dark:text-white backdrop:bg-white/90 dark:backdrop:bg-black/90 backdrop:backdrop-blur-md">
<div class="flex items-center px-4 py-4 border-b border-slate-100 dark:border-slate-800 shrink-0">{% include icon.html name="Search" pixels=24 class="text-slate-400 mr-3" %}<label class="sr-only" for="site-search"><span data-lang="en">Search site</span><span data-lang="zh">站内搜索</span></label><input id="site-search" data-search-input type="search" autocomplete="off" placeholder="Search research, news, projects, people..." data-placeholder-en="Search research, news, projects, people..." data-placeholder-zh="搜索研究、新闻、项目和成员……" class="min-w-0 flex-1 bg-transparent border-none outline-none text-xl text-slate-900 dark:text-white placeholder-slate-400 font-sans"><button type="button" data-search-close aria-label="Close search" data-aria-en="Close search" data-aria-zh="关闭搜索" class="p-2 text-slate-400 hover:text-slate-900 dark:hover:text-white transition-colors">{% include icon.html name="X" pixels=20 %}</button></div>
<div data-search-results aria-live="polite" class="overflow-y-auto p-2 scroll-smooth max-h-[60vh]"><p class="p-8 text-center text-slate-400 font-mono text-sm"><span data-lang="en">Type to start searching...</span><span data-lang="zh">输入关键词开始搜索……</span></p></div>
<div hidden data-search-footer class="bg-slate-50 dark:bg-slate-900/50 p-3 text-center border-t border-slate-100 dark:border-slate-800"><span class="text-xs text-slate-400 font-mono"><span data-lang="en">Press ESC to close</span><span data-lang="zh">按 ESC 关闭</span></span></div>
</dialog>
<template data-search-icon="news">{% include icon.html name="Newspaper" class="mt-0.5 text-slate-400 group-hover:text-blue-500" %}</template>
<template data-search-icon="publication">{% include icon.html name="FileText" class="mt-0.5 text-slate-400 group-hover:text-blue-500" %}</template>
<template data-search-icon="project">{% include icon.html name="Folder" class="mt-0.5 text-slate-400 group-hover:text-blue-500" %}</template>
