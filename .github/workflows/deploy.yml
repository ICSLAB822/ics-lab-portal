name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Validate content
        run: bundle exec ruby scripts/validate_content.rb
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:css
      - name: Validate supported base URLs
        run: npm run test:baseurls
      - name: Build Jekyll site
        run: bundle exec jekyll build --trace --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Validate generated HTML
        run: |
          bundle exec ruby scripts/validate_site.rb
          bundle exec ruby scripts/check_links.rb
        env:
          SITE_BASEURL: ${{ steps.pages.outputs.base_path }}
      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run browser, responsive and accessibility tests
        run: npm test
        env:
          CROSS_BROWSER: '1'
          SITE_BASEURL: ${{ steps.pages.outputs.base_path }}
      - name: Run announcement lifecycle tests
        run: npm run test:announcement
      - name: Audit production npm dependencies
        run: npm run audit:production
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
