fullName_en: "Innovation of Cyber Security Laboratory"
fullName_zh: "网络空间安全创新实验室"
description_en: "ICS LAB focuses on the critical intersection of cyber security, privacy computing, and mobile crowd sensing. Our mission is to build secure, trustworthy, and resilient infrastructures for the digital era."
description_zh: "ICS LAB 专注于网络安全、隐私计算以及移动群智感知的交叉前沿领域。我们的使命是为数字时代搭建安全、可信与具有韧性的基础设施。"
