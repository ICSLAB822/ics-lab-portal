    - title: "Go Straight"
      desc: "Walk straight along the main avenue for about 400 meters."
    - title: "Information Center"
      desc: "Locate the Information Science & Technology Center (Building No. 2) on your left."
    - title: "To the Lab"
      desc: "Take the elevator to the 4th floor, turn right to find ICS Lab."
